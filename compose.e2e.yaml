services:
  e2e:
    image: ${PMS_BACKEND_IMAGE:-pms-backend:e2e}
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "tests/e2e/real-dependencies.mjs"]
    environment:
      PMS_API_URL: http://api:3001/api
      OIDC_TOKEN_URL: http://keycloak:8080/realms/pms-dev/protocol/openid-connect/token
      OIDC_CLIENT_ID: pms-e2e
      OIDC_TEST_USERNAME: ${KEYCLOAK_DEV_USER:-developer}
      OIDC_TEST_PASSWORD: ${KEYCLOAK_DEV_PASSWORD:?set KEYCLOAK_DEV_PASSWORD}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-pms}:${RABBITMQ_PASSWORD}@rabbitmq:5672/pms
    volumes:
      - ./tests/e2e/real-dependencies.mjs:/app/tests/e2e/real-dependencies.mjs:ro
    depends_on:
      api: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      keycloak-bootstrap: { condition: service_completed_successfully }
      db-seed: { condition: service_completed_successfully }
    read_only: true
    init: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks: [pms]
