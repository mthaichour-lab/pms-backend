name: Backend CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - name: Initialize CodeQL SAST
        uses: github/codeql-action/init@fddeee1a7ece751b577e409a89057319e3172939
        with:
          languages: javascript-typescript
      - run: pnpm install --frozen-lockfile
      - run: pnpm run contracts:lint
      - run: pnpm run contracts:check-sdk
      - run: pnpm run database:verify
      - run: pnpm run database:verify-seeds
      - run: pnpm run token-vault:verify
      - run: pnpm run typecheck
      - run: pnpm run test
      - name: Run isolated DR simulation without production secrets
        run: pnpm run dr:simulate-local
      - name: Analyze source with CodeQL
        uses: github/codeql-action/analyze@fddeee1a7ece751b577e409a89057319e3172939
      - run: pnpm audit --audit-level high --prod
      - name: Scan secrets and Docker configuration
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          hide-progress: "true"
      - run: pnpm run build
      - run: pnpm run deploy:verify
      - run: pnpm run e2e:smoke
      - name: Run real PostgreSQL, RabbitMQ and OIDC integration
        env:
          POSTGRES_PASSWORD: ci-postgres-${{ github.run_id }}
          RABBITMQ_PASSWORD: ci-rabbitmq-${{ github.run_id }}
          KEYCLOAK_ADMIN_PASSWORD: ci-keycloak-admin-${{ github.run_id }}
          KEYCLOAK_DEV_PASSWORD: ci-keycloak-user-${{ github.run_id }}
        run: |
          cp .env.local.example .env.local
          cp .env.compose.example .env.compose
          printf '\nPOSTGRES_PASSWORD=%s\nRABBITMQ_PASSWORD=%s\nKEYCLOAK_ADMIN_PASSWORD=%s\nKEYCLOAK_DEV_PASSWORD=%s\n' "$POSTGRES_PASSWORD" "$RABBITMQ_PASSWORD" "$KEYCLOAK_ADMIN_PASSWORD" "$KEYCLOAK_DEV_PASSWORD" >> .env.local
          pnpm run e2e:real
      - name: Collect real integration service logs
        if: failure()
        run: |
          if [ -f .env.local ]; then
            docker compose --env-file .env.local -f compose.yaml -f compose.local.yaml -f compose.e2e.yaml --profile local-seed logs --no-color
          fi
      - name: Tear down real integration stack
        if: always()
        run: |
          if [ -f .env.local ]; then
            pnpm run e2e:real:down
          fi
      - name: Build immutable backend image
        run: |
          mkdir -p build-output
          docker build --label org.opencontainers.image.revision=${{ github.sha }} --tag pms-backend:${{ github.sha }} .
      - name: Generate image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: pms-backend:${{ github.sha }}
          format: spdx-json
          output-file: build-output/pms-backend.sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Scan backend image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          image-ref: pms-backend:${{ github.sha }}
          format: json
          output: build-output/trivy-image.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          hide-progress: "true"
      - name: Export immutable image artifact
        run: |
          docker save pms-backend:${{ github.sha }} --output build-output/pms-backend.oci.tar
          sha256sum build-output/pms-backend.oci.tar > build-output/pms-backend.oci.sha256
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - name: Sign image artifact with GitHub OIDC
        run: cosign sign-blob build-output/pms-backend.oci.tar --bundle build-output/pms-backend.oci.sigstore.json --yes
      - name: Upload promoted artifact bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pms-backend-${{ github.sha }}
          path: build-output
          if-no-files-found: error
